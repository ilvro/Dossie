<!doctype html>
<html lang="pt-BR" data-theme="erpg-dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="theme-color" content="#08070d" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="description" content="Ficha interativa de Ordem Paranormal II" />
    <title>Ficha de personagem | Ordem Paranormal</title>
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="apple-touch-icon" href="./icons/ordem-192.png" />
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body>
    <svg id="token-svg-defs" class="token-svg-defs" style="position:absolute;width:0;height:0;overflow:hidden;pointer-events:none;" aria-hidden="true">
      <defs>
        <filter id="token-controlled-outline" x="-12%" y="-12%" width="124%" height="124%" color-interpolation-filters="sRGB">
          <!-- Ambient depth shadow underneath -->
          <feGaussianBlur in="SourceAlpha" stdDeviation="10" result="ambientBlur" />
          <feOffset in="ambientBlur" dx="0" dy="14" result="ambientOffset" />
          <feFlood flood-color="#000000" flood-opacity="0.8" result="shadowColor" />
          <feComposite in="shadowColor" in2="ambientOffset" operator="in" result="ambientShadow" />

          <!-- Directional rim lighting with subtle fade (100% GPU-accelerated in Firefox WebRender & Chromium) -->
          <feGaussianBlur id="token-outline-morph" in="SourceAlpha" stdDeviation="1.8" result="dilatedBlur" />
          <feComponentTransfer in="dilatedBlur" result="dilated">
            <feFuncA type="linear" slope="5.5" intercept="0" />
          </feComponentTransfer>
          <feOffset id="token-outline-offset" in="dilated" dx="-2.5" dy="0" result="shiftedDilated" />
          <feGaussianBlur id="token-outline-blur" in="shiftedDilated" stdDeviation="1.5" result="fadedOutline" />
          <feComposite in="fadedOutline" in2="SourceAlpha" operator="out" result="outerRim" />
          <feFlood id="token-outline-flood" flood-color="#e0150d" flood-opacity="0.5" result="outlineColor" />
          <feComposite in="outlineColor" in2="outerRim" operator="in" result="coloredRim" />

          <!-- Merge: Ambient Shadow + Controlled Outer Outline + Original Sharp Graphic on Top -->
          <feMerge>
            <feMergeNode in="ambientShadow" />
            <feMergeNode in="coloredRim" />
            <feMergeNode in="SourceGraphic" />
          </feMerge>
        </filter>
      </defs>
    </svg>
    <div id="app"></div>
    <script type="module" src="/src/app.js"></script>
  </body>
</html>
